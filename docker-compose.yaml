name: roboshop
services:
  mongodb:
    build: ./mongodb
    image: ramdocker22/mongodb:v1
    container_name: mongodb
  catalogue:
   build: ./catalogue
   image: ramdocker22/catalogue:v1
   container_name: catalogue
   depends_on:
   - mongodb
  frontend:
    build: ./frontend
    image: ramdocker/frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
  user :
    build: ./user
    image: ramdocker/user:v1
    container_name: user
    environment:
      MONGO: true
      REDIS_URL: 'redis://redis:6379'
      MONGO_URL: "mongodb://mongodb:27017/users"
    depends_on:
    - redis
    - mongodb
  redis:
    image: redis:7
    container_name: redis # docker run -d --name redis --network roboshop redis:7
networks:
  default:
    name: roboshop
    driver: bridge
    external: false